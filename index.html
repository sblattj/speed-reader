<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Reader</title>
<style>
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: Georgia, "Iowan Old Style", serif;
  --radius: 14px;
  --radius-sm: 9px;
  color-scheme: light dark;
}

html, html[data-theme="light"] {
  --bg: #f7f5f0;
  --bg-elev: #ffffff;
  --bg-card: #ffffff;
  --text: #201d1a;
  --text-dim: #635e55;
  --border: #e2ddd3;
  --accent-pivot: #cf4520;
  --accent-control: #147888;
  --accent-control-ink: #ffffff;
  --shadow: rgba(20, 16, 10, 0.10);
  --highlight-bg: rgba(20, 120, 136, 0.16);
  --overlay-bg: rgba(247, 245, 240, 0.92);
  --end-card-bg: #f7f5f0;
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg: #14161a;
    --bg-elev: #1b1e24;
    --bg-card: #1f232a;
    --text: #eae7e0;
    --text-dim: #9ea4ae;
    --border: #2c313a;
    --accent-pivot: #ff6f47;
    --accent-control: #4fb8c4;
    --accent-control-ink: #08282c;
    --shadow: rgba(0, 0, 0, 0.45);
    --highlight-bg: rgba(79, 184, 196, 0.20);
    --overlay-bg: rgba(20, 22, 26, 0.90);
    --end-card-bg: #14161a;
  }
}

html[data-theme="dark"] {
  --bg: #14161a;
  --bg-elev: #1b1e24;
  --bg-card: #1f232a;
  --text: #eae7e0;
  --text-dim: #9ea4ae;
  --border: #2c313a;
  --accent-pivot: #ff6f47;
  --accent-control: #4fb8c4;
  --accent-control-ink: #08282c;
  --shadow: rgba(0, 0, 0, 0.45);
  --highlight-bg: rgba(79, 184, 196, 0.20);
  --overlay-bg: rgba(20, 22, 26, 0.90);
  --end-card-bg: #14161a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  transition: background-color 0.2s ease, color 0.2s ease;
}

button, input {
  font-family: inherit;
  color: inherit;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
}

.app-header h1 {
  font-size: 1.15rem;
  margin: 0;
  letter-spacing: 0.01em;
  font-weight: 700;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.15s ease, transform 0.1s ease;
}
.icon-btn:hover { background: var(--bg-card); }
.icon-btn:active { transform: scale(0.94); }

.app-main {
  max-width: 880px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 1px 3px var(--shadow);
  padding: 1.1rem 1.25rem;
}

.segmented {
  display: inline-flex;
  gap: 0.25rem;
  padding: 0.25rem;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 999px;
}

.segmented button {
  border: none;
  background: transparent;
  padding: 0.45rem 0.9rem;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-dim);
  transition: background-color 0.15s ease, color 0.15s ease;
}
.segmented button.active {
  background: var(--accent-control);
  color: var(--accent-control-ink);
}
.segmented button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.chunk-size-group {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.chunk-size-note {
  font-size: 0.78rem;
  color: var(--text-dim);
}

.mode-row {
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-card {
  padding: 0;
  overflow: hidden;
}

.progress-track {
  height: 3px;
  background: var(--border);
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent-control);
  transition: width 0.1s linear;
}

.stage {
  position: relative;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem 1.25rem;
}

.stage-hint {
  color: var(--text-dim);
  font-size: 0.95rem;
  text-align: center;
  max-width: 32ch;
}

/* RSVP view */
.rsvp-view {
  width: 100%;
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.rsvp-view[hidden] { display: none; }

.crosshair {
  position: absolute;
  left: 50%;
  width: 2px;
  background: var(--text-dim);
  opacity: 0.45;
  transform: translateX(-50%);
}
.crosshair.top { top: 14px; height: 16px; }
.crosshair.bottom { bottom: 14px; height: 16px; }

.pivot-grid {
  display: flex;
  align-items: baseline;
  justify-content: center;
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 5vw, 3rem);
}
.pivot-cell {
  white-space: nowrap;
  overflow: visible;
}
.pivot-cell.before { width: 12ch; text-align: right; }
.pivot-cell.pivot {
  width: 1.15ch;
  text-align: center;
  color: var(--accent-pivot);
  font-weight: 700;
}
.pivot-cell.after { width: 12ch; text-align: left; }

.multi-word {
  font-family: var(--font-serif);
  font-size: clamp(1.5rem, 4.5vw, 2.5rem);
  text-align: center;
  padding: 0 0.5rem;
}

/* Chunk view */
.chunk-view {
  width: 100%;
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 1rem;
}
.chunk-view[hidden] { display: none; }

.chunk-phrase {
  font-family: var(--font-serif);
  font-size: clamp(1.8rem, 4.2vw, 2.2rem);
  text-align: center;
  line-height: 1.35;
  max-width: 34ch;
}

/* Pacer view */
.pacer-wrap {
  width: 100%;
  max-height: 360px;
  overflow-y: auto;
  padding: 0.25rem 0.25rem 0.25rem 0;
}
.pacer-wrap[hidden] { display: none; }

.pacer-text {
  max-width: 65ch;
  margin: 0 auto;
  font-family: var(--font-serif);
  font-size: 1.15rem;
  line-height: 1.75;
  padding: 0.5rem 0.75rem;
}
.pacer-text p { margin: 0 0 1.2em; }
.pacer-text p:last-child { margin-bottom: 0; }

.pw {
  cursor: pointer;
  border-radius: 4px;
  padding: 0.03em 0.05em;
  transition: background-color 0.12s ease;
}
.pw:hover { background: var(--border); }
.pw.current {
  background: var(--highlight-bg);
  box-shadow: 0 0 0 1px var(--accent-control);
}

/* Countdown */
.countdown-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--overlay-bg);
  font-family: var(--font-serif);
  font-size: 3.5rem;
  font-weight: 700;
  color: var(--accent-control);
}
.countdown-overlay[hidden] { display: none; }

/* End card */
.end-card {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--end-card-bg);
  padding: 1.5rem;
}
.end-card[hidden] { display: none; }
.end-card-inner {
  max-width: 40ch;
  text-align: center;
}
.end-card-inner h2 {
  margin: 0 0 0.75rem;
  font-size: 1.3rem;
}
.end-stats {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  margin: 1rem 0;
}
.end-stat { display: flex; flex-direction: column; }
.end-stat .value { font-size: 1.4rem; font-weight: 700; color: var(--accent-control); }
.end-stat .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
.end-nudge {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin: 1rem 0;
  line-height: 1.5;
}
.end-actions {
  display: flex;
  gap: 0.6rem;
  justify-content: center;
  flex-wrap: wrap;
}

.word-readout {
  padding: 0.5rem 1.25rem 0.9rem;
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
}

/* Control bar */
.control-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
  justify-content: space-between;
}

.transport {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.transport .icon-btn[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
}

.transport .play-btn {
  width: 48px;
  height: 48px;
  background: var(--accent-control);
  color: var(--accent-control-ink);
  border-color: var(--accent-control);
  font-size: 1.2rem;
}

.wpm-control {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex: 1 1 220px;
  min-width: 180px;
}
.wpm-control input[type="range"] {
  flex: 1;
  accent-color: var(--accent-control);
}
.wpm-label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-dim);
  min-width: 6.5ch;
  text-align: right;
}

/* Text panel */
.text-panel summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 600;
  font-size: 0.95rem;
}
.text-panel summary::-webkit-details-marker { display: none; }
.text-panel summary .chev {
  display: inline-block;
  transition: transform 0.15s ease;
  color: var(--text-dim);
}
.text-panel[open] summary .chev { transform: rotate(90deg); }

.text-panel-body {
  margin-top: 0.9rem;
}

textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 0.75rem;
  font-size: 0.92rem;
  line-height: 1.5;
}

.text-panel-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.6rem;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.word-count {
  font-size: 0.8rem;
  color: var(--text-dim);
}

.btn-primary {
  border: 1px solid var(--accent-control);
  background: var(--accent-control);
  color: var(--accent-control-ink);
  border-radius: 999px;
  padding: 0.5rem 1.1rem;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
}
.btn-primary:hover { filter: brightness(1.05); }

.btn-secondary {
  border: 1px solid var(--border);
  background: var(--bg-elev);
  color: var(--text);
  border-radius: 999px;
  padding: 0.5rem 1.1rem;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--bg-card); }

@media (max-width: 480px) {
  .app-header { padding: 0.85rem 1rem; }
  .app-main { padding: 1rem 0.75rem 2.5rem; gap: 1rem; }
  .card { padding: 0.9rem; }
  .pivot-cell.before, .pivot-cell.after { width: 7ch; }
  .pivot-grid { font-size: clamp(1.4rem, 8vw, 2rem); }
  .multi-word { font-size: clamp(1.2rem, 6.5vw, 1.8rem); }
  .chunk-phrase { font-size: clamp(1.3rem, 6.5vw, 1.7rem); }
  .control-bar { justify-content: center; }
  .wpm-control { flex-basis: 100%; }
  .end-stats { gap: 0.9rem; }
}

</style>
</head>
<body>
<header class="app-header">
  <h1>Speed Reader</h1>
  <button id="themeToggleBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">&#9728;</button>
</header>

<main class="app-main">
  <div id="readerRoot"></div>

  <details class="card text-panel" id="textPanel" open>
    <summary><span class="chev">&#9656;</span> Your text</summary>
    <div class="text-panel-body">
      <textarea id="textArea" spellcheck="false"></textarea>
      <div class="text-panel-footer">
        <span class="word-count" id="wordCountLabel">0 words</span>
        <button type="button" class="btn-primary" id="btnLoadText">Load text</button>
      </div>
    </div>
  </details>
</main>

` + `Skilled adult readers average roughly 200 to 400 words per minute. That range has held up across decades of research, and it exists mostly because of how the brain processes language, not because of how quickly the eyes move. Understanding a sentence takes time no matter how fast the words appear on a screen. Comprehension, not eye speed, is usually the real bottleneck.

` + `Normal reading is not a smooth glide across the page. About 10 to 15 percent of eye movements during reading are regressions, brief backward glances that let a reader recheck a word or resolve a confusing phrase. Readers also use parafoveal vision to preview upcoming words before their eyes land on them, which primes recognition and speeds comprehension. RSVP style flashing, where one word or a short chunk appears alone at a fixed point, removes both of these tools at once. There is nothing to glance back at and nothing ahead to preview.

` + `The research on this is fairly consistent. Schotter, Tran and Rayner (2012) found that preventing readers from looking back at earlier text hurt comprehension, even when overall speed went up. Benedetto and colleagues (2015) tested Spritz style flashing directly and found it held up on surface comprehension at moderate speeds, but increased eye strain and made deeper understanding harder. Rayner and colleagues summarized the field in a widely cited 2016 review titled "So Much to Read, So Little Time," concluding that there is no free lunch: push reading speed past a person’s natural rate and comprehension pays the price.

` + "The honest path to reading faster is slower to describe but it works. Practice reading a little above your comfortable pace, build the vocabulary and background knowledge that let you predict where a sentence is going, and learn deliberate skimming for moments when you only need the gist. A pacer that pushes your pace while leaving the full text visible keeps regressions and preview available, which is exactly why this tool includes one.";
  function createLocalStorageAdapter() {
    return {
      get: function(key) {
        return localStorage.getItem(key);
      },
      set: function(key, value) {
        localStorage.setItem(key, value);
      }
    };
  }
  async function init() {
    var storage = createLocalStorageAdapter();
    var themeToggleBtn = document.getElementById("themeToggleBtn");
    var textAreaEl = document.getElementById("textArea");
    var wordCountLabelEl = document.getElementById("wordCountLabel");
    var btnLoadText = document.getElementById("btnLoadText");
    var readerRootEl = document.getElementById("readerRoot");
    var themeState = { theme: "dark" };
    function updateThemeButton() {
      themeToggleBtn.textContent = themeState.theme === "dark" ? "☾" : "☀";
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeState.theme = theme;
      storage.set("sr_theme", theme);
      updateThemeButton();
    }
    function updateWordCountLabel() {
      var n = (textAreaEl.value.match(/\S+/g) || []).length;
      wordCountLabelEl.textContent = n.toLocaleString() + (n === 1 ? " word" : " words");
    }
    var savedTheme = await storage.get("sr_theme");
    var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (savedTheme === "dark" || savedTheme === "light") {
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeState.theme = savedTheme;
    } else {
      themeState.theme = systemDark ? "dark" : "light";
    }
    updateThemeButton();
    themeToggleBtn.addEventListener("click", function() {
      applyTheme(themeState.theme === "dark" ? "light" : "dark");
      themeToggleBtn.blur();
    });
    textAreaEl.value = SAMPLE_TEXT;
    updateWordCountLabel();
    textAreaEl.addEventListener("input", updateWordCountLabel);
    var reader = await mount(readerRootEl, {
      storage,
      keyEventTarget: document,
      initialText: { text: SAMPLE_TEXT, title: null }
    });
    btnLoadText.addEventListener("click", function() {
      var raw = textAreaEl.value;
      var text = raw;
      if (!text || !text.trim()) {
        text = SAMPLE_TEXT;
        textAreaEl.value = SAMPLE_TEXT;
        updateWordCountLabel();
      }
      reader.loadText(text);
      btnLoadText.blur();
    });
  }
  if (typeof document !== "undefined") {
    init();
  }
})();

</script>
